# InnoDB Cluster setup following the MySQL guide
# https://dev.mysql.com/blog-archive/docker-compose-setup-for-innodb-cluster/
#
# Topology (same as the guide):
#   mysql1, mysql2, mysql3  - cluster members (mysql:8.0 includes both mysqld
#                             and mysqlsh, so one image covers servers + shell)
#   init-cluster            - temporary mysqlsh container that creates the
#                             cluster and joins members, then exits
#   router                  - bootstrapped against the cluster (RW 6446 / RO 6447)
#   app                     - Laravel app connecting through router:6446

networks:
  epoch-network:
    driver: bridge

  edge:
    external: true

volumes:
  mysql1_data:
  mysql2_data:
  mysql3_data:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: epoch-converter-app
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      router:
        condition: service_started
    networks:
      - epoch-network
      - edge

  # Shared config for all three nodes lives in database_cluster/base.cnf;
  # per-node identity (server_id, report_host, GR addresses) in node{N}.cnf.
  # No `command:` overrides on purpose: custom mysqld args are what broke
  # first-boot initialization in previous attempts.
  mysql1:
    image: mysql:8.0
    container_name: mysql1
    hostname: mysql1
    # Required for clone-based recovery: after cloning, mysqld restarts
    # itself and needs a supervisor to bring it back up.
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./database_cluster/base.cnf:/etc/mysql/conf.d/10-base.cnf:ro
      - ./database_cluster/node1.cnf:/etc/mysql/conf.d/20-node.cnf:ro
      - mysql1_data:/var/lib/mysql
    healthcheck:
      # mysqladmin ping exits 0 as soon as the server answers, even without
      # credentials - no password needed here.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - epoch-network

  mysql2:
    image: mysql:8.0
    container_name: mysql2
    hostname: mysql2
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./database_cluster/base.cnf:/etc/mysql/conf.d/10-base.cnf:ro
      - ./database_cluster/node2.cnf:/etc/mysql/conf.d/20-node.cnf:ro
      - mysql2_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - epoch-network

  mysql3:
    image: mysql:8.0
    container_name: mysql3
    hostname: mysql3
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./database_cluster/base.cnf:/etc/mysql/conf.d/10-base.cnf:ro
      - ./database_cluster/node3.cnf:/etc/mysql/conf.d/20-node.cnf:ro
      - mysql3_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - epoch-network

  init-cluster:
    image: mysql:8.0
    container_name: init-cluster
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./database_cluster/init_cluster.js:/scripts/init_cluster.js:ro
    depends_on:
      mysql1:
        condition: service_healthy
      mysql2:
        condition: service_healthy
      mysql3:
        condition: service_healthy
    networks:
      - epoch-network
    restart: "no"
    # The shell bundled in mysql:8.0 opens its startup session BEFORE reading
    # the script; without an explicit --uri it dials the local socket (absent
    # in this container) and dies with Error 2002 before any script code runs.
    # MYSQLSH_*/MYSQL_PWD env vars are NOT honored here, so credentials go on
    # the command line (dev-only setup).
    entrypoint: ["mysqlsh", "--uri=root:${MYSQL_ROOT_PASSWORD}@mysql1:3306", "--js"]
    command: ["-f", "/scripts/init_cluster.js"]

  router:
    image: mysql/mysql-router:8.0
    container_name: mysql-router
    environment:
      MYSQL_HOST: mysql1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_CREATE_ROUTER_USER: 1
    ports:
      - "6446:6446"
      - "6447:6447"
    restart: unless-stopped
    depends_on:
      init-cluster:
        # Safety net: only bootstrap the router once init_cluster.js exited 0,
        # i.e. against a fully provisioned cluster.
        condition: service_completed_successfully
    networks:
      - epoch-network
