services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: epoch-converter-app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=epoch_converter
      - DB_USERNAME=epoch_user
      - DB_PASSWORD=epoch_password
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - epoch-network

  mysql:
    image: mysql:8.0
    container_name: epoch-converter-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=epoch_converter
      - MYSQL_USER=epoch_user
      - MYSQL_PASSWORD=epoch_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - epoch-network

volumes:
  mysql_data:

networks:
  epoch-network:
    driver: bridge